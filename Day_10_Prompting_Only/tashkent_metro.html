<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tashkent Metro Map</title>
  <style>
    :root {
      --bg: #eef1f4;
      --paper: #ffffff;
      --grid: rgba(0,0,0,0.05);
      --ink: #1a2b3d;
      --gray: #666666;
      --gray-dark: #555555;
      --red: #d92929;
      --blue: #1e5bc6;
      --green: #2e9e4b;
      --yellow: #f5b800;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;   
      color: var(--ink);
    }

    body {
      display: grid;
      place-items: center;
      padding: 18px;
    }

    svg {
      display: block;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 12px 26px rgba(0,0,0,0.08);
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.02em;
      fill: var(--ink);
      text-anchor: middle;
    }

    .route {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 7;
    }

    .station {
      fill: currentColor;
      stroke: #ffffff;
      stroke-width: 4;
    }

    .label {
      font-size: 11px;
      font-weight: 700;
      fill: var(--ink);
      dominant-baseline: middle;
    }

    .label-small {
      font-size: 10px;
      font-weight: 700;
      fill: var(--ink);
      dominant-baseline: middle;
    }

    .mini-label {
      font-size: 9px;
      font-weight: 700;
      fill: var(--gray);
      dominant-baseline: middle;
    }

    .connector {
      fill: #ffffff;
      stroke: var(--gray-dark);
      stroke-width: 2;
    }

    .landmark {
      fill: none;
      stroke: var(--gray);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .legend-box {
      fill: rgba(255,255,255,0.72);
      stroke: rgba(0,0,0,0.08);
      stroke-width: 1;
    }

    .legend-label {
      font-size: 10.5px;
      font-weight: 700;
      fill: var(--ink);
    }

    .legend {
      width: 960px;
      margin: 12px auto;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .legend-swatch {
      width: 18px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
      flex-shrink: 0;
    }

    .legend-transfer {
      width: 52px;
      height: 18px;
      border-radius: 9px;
      border: 2px solid #555;
      background: #fff;
      display: inline-block;
      flex-shrink: 0;
    }

    .legend-station {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid #555;
      background: #fff;
      display: inline-block;
      flex-shrink: 0;
    }
  </style>
</head>
